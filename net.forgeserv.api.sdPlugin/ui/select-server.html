<!DOCTYPE html>
<html>

<head lang="en">
    <title>ForgeServ Status Settings</title>
    <meta charset="utf-8" />
    <script src="https://sdpi-components.dev/releases/v3/sdpi-components.js"></script>
</head>

<body>
    <sdpi-item label="Server Index">
        <sdpi-textfield 
            setting="serverIndex" 
            type="number" 
            value="0" 
            placeholder="0"
            pattern="\d*"
            required 
            showlabels
        ></sdpi-textfield>
    </sdpi-item>

    <sdpi-item label="Refresh Frequency (Seconds)">
        <sdpi-textfield 
            setting="refreshFrequency" 
            type="number" 
            value="5" 
            placeholder="5"
            pattern="\d*"
            required 
            showlabels
        ></sdpi-textfield>
    </sdpi-item>

    <sdpi-item label="Reset Timeout (Seconds)">
        <sdpi-textfield 
            setting="resetTimeout" 
            type="number" 
            value="10" 
            placeholder="10"
            pattern="\d*"
            required 
            showlabels
        ></sdpi-textfield>
    </sdpi-item>
</body>

</html>
